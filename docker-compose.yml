services:
  hotspot-portal:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: hotspot-portal
    restart: unless-stopped
    # Solo local: nginx hace de proxy público
    ports:
      - "127.0.0.1:8120:3000"
    environment:
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ROUTER_CRED_KEY: ${ROUTER_CRED_KEY}
      CRON_SECRET: ${CRON_SECRET:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      ALLOW_PUBLIC_SCHOOL_REGISTRATION: ${ALLOW_PUBLIC_SCHOOL_REGISTRATION:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
