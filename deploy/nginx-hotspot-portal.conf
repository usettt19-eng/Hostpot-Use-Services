# /etc/nginx/sites-available/hotspot-portal  
server {
    listen 80;
    server_name connect.useservices.company;

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Luego: sudo certbot --nginx -d connect.useservices.company   (agrega el bloque 443 y la redirección)
